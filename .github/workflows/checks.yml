name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  # The House box deploys a commit of main only when THESE checks passed on that exact commit
  # (`league/updater.py`). A merge made with the Actions token starts no workflow -- GitHub's rule --
  # so a commit Merton's merge job leaves on main would never carry them: the merge job dispatches
  # this workflow, and the hourly run catches any head that still has none.
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  # A newer change to a ref supersedes the run still testing the older one. The hourly run has a group of its own:
  # sharing one, its start cancelled the push run already testing the same head (Sept 30, 2026: push run 36679154604
  # on main, cancelled at 06:49:51Z by schedule run 36680281219, begun at 06:49:37Z).
  group: checks-${{ github.ref }}-${{ github.event_name == 'schedule' && 'hourly' || 'change' }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify the external trading boundary
        working-directory: gateway
        run: npm run check && npm test
  tests:
    runs-on: ubuntu-latest
    # 35, not 20 (Sept 30, 2026): the league's tests alone took 8m41s-17m49s a job on Sept 29-30 (most 12-15 minutes),
    # and the 20-minute limit cut off two 3.11 jobs: PR run 36578499862 (Sept 29) and the push run on f082cf5e
    # (36689802805, 08:47:58Z Sept 30, its league step 17m49s in). A run cut off by its own limit attests nothing
    # (`league/updater.py` reads a cancelled run as no verdict), so the limit keeps a wide margin over the slowest job
    # seen, and the tests' scratch lives in memory (the step below).
    # Before that, 20, not 10 (Sept 24, 2026): the 3.14 job hit a 10-minute limit twice in a row on Deploy C' (#274).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Keep the tests' scratch files in memory
        # The live path keeps its state in SQLite (WAL, synchronous=FULL) and writes JSON with fsync
        # (`league/live/state.py`), and the whole-day live tests commit thousands of times: on the runner's disk each
        # commit waits for the device. On /dev/shm (tmpfs) the same code runs and the same fsync calls return at once.
        # The runner's own temp directory stays where /dev/shm is missing, not writable or mounted noexec (some tests
        # run programs they write to their scratch).
        run: |
          dir=/dev/shm/ltcm-tests
          if mkdir -p "$dir" && [ -w "$dir" ] && ! findmnt -rno OPTIONS --target /dev/shm | tr ',' '\n' | grep -qx noexec; then
            echo "TMPDIR=$dir" >> "$GITHUB_ENV"
            echo "the tests' scratch: $dir"
            df -h /dev/shm
          else
            echo "the tests' scratch: the runner's temp directory (/dev/shm is not usable here)"
          fi
      - name: Install the isolated checks' namespace runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap patchelf
          # Only this disposable hosted runner: Ubuntu's default AppArmor
          # restriction otherwise denies the sandbox's namespace capabilities.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /usr/bin/true
      - name: Keep the selected Python inside the existing sandbox mounts
        env:
          LTCM_EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys

          expected = os.environ["LTCM_EXPECTED_PYTHON"]
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == expected
          selected_version = sys.version
          selected_root = pathlib.Path(sys.base_prefix).resolve()
          selected_binary = pathlib.Path(sys.executable).resolve().relative_to(selected_root)
          runtime = pathlib.Path("/usr/local/lib/ltcm-checks-python")
          venv = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ltcm-checks-venv"
          assert not runtime.exists() and not venv.exists(), "fresh disposable runtime destinations required"
          # Copy the exact setup-python runtime, including stdlib and shared libraries.
          # /usr is already mounted read-only by ImprovementLab; /opt is not exposed.
          subprocess.run(["sudo", "cp", "-a", str(selected_root), str(runtime)], check=True)
          subprocess.run([str(runtime / selected_binary), "-m", "venv", "--copies", str(venv)], check=True)
          # setup-python supplies LD_LIBRARY_PATH, but sandbox --clearenv removes it.
          # Patch only the disposable venv copies' loader metadata: their CPython
          # code and the copied canonical runtime stay the selected version.
          for name in ("python", "python3", f"python{expected}"):
              binary = venv / "bin" / name
              assert binary.is_file() and not binary.is_symlink(), "venv interpreter must be a real copy"
              old = subprocess.check_output(["patchelf", "--print-rpath", str(binary)], text=True).strip()
              search = str(runtime / "lib") + (":" + old if old else "")
              subprocess.run(["patchelf", "--set-rpath", search, str(binary)], check=True)
          probe = "import ctypes,json,sqlite3,ssl,sys; print(json.dumps({'version':sys.version,'base_prefix':sys.base_prefix}))"
          result = json.loads(subprocess.check_output([str(venv / "bin" / "python3"), "-I", "-c", probe],
                              env={"PATH": "/usr/bin:/bin", "LANG": "C.UTF-8"}, text=True))
          assert result == {"version": selected_version, "base_prefix": str(runtime)}, result
          receipt = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ltcm-checks-runtime.json"
          receipt.write_text(json.dumps(result))
          with open(os.environ["GITHUB_PATH"], "a") as handle:
              handle.write(str(venv / "bin") + "\n")
          print(json.dumps({"selected_python": expected, **result, "venv": str(venv)}, sort_keys=True))
          PYTHON
      - name: Install the Gym's dependencies when the tree pins them
        # Install into the copied venv that the actual ImprovementLab sandbox mounts.
        run: |
          if [ -f requirements-gym.txt ]; then python3 -m pip install --disable-pip-version-check -r requirements-gym.txt; fi
      - name: Prove the selected Python in the actual isolated evaluator
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, sys, tempfile
          from league.swarm.improvement import sandbox

          expected = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "ltcm-checks-runtime.json").read_text())
          code = "import ctypes,json,sqlite3,ssl,sys; "
          if pathlib.Path("requirements-gym.txt").is_file():
              code += "import numpy,pyarrow,polars; "
          code += "observed={'version':sys.version,'base_prefix':sys.base_prefix}; "
          code += "assert observed==" + repr(expected) + ", observed; print(json.dumps(observed))"
          with tempfile.TemporaryDirectory(prefix="checks-python-namespace-") as directory:
              base = pathlib.Path(directory)
              tree, judge = base / "tree", base / "judge"
              tree.mkdir(); judge.mkdir()
              result = sandbox(tree, judge, ["-I", "-c", code], python=pathlib.Path(sys.executable), timeout=60)
          assert result["exit"] == 0, result
          assert json.loads(result["stdout"]) == expected, result
          print(result["stdout"].strip())
          PYTHON
      - name: Run the first run's runtime tests
        # Both suites run until the full prune (Wave 2b) deletes ltcm/ and its tests.
        run: python3 -m unittest discover -s ltcm/tests -t .
      - name: Run the league's tests
        run: python3 -m unittest discover -s league/tests -t .
      - name: The league's content checks (strategies, tools, game and config bounds)
        run: python3 -m league.ci --no-tests
