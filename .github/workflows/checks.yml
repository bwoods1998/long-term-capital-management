name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  # Owner deployments verify checks on the exact commit. The in-box updater stays off.
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Verify the external trading boundary
        working-directory: gateway
        run: npm run check && npm test
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Gym's dependencies when the tree pins them
        # The Gym (league/gym/, Wave 3 of the options overhaul, Sept 26, 2026) needs numpy, pyarrow and polars; the rest
        # of the repository is standard library only. Nothing to install on a tree without the file.
        run: |
          if [ -f requirements-gym.txt ]; then python3 -m pip install --disable-pip-version-check -r requirements-gym.txt; fi
      - name: Run the league's tests
        run: python3 -m unittest discover -s league/tests -t .
      - name: Validate public examples, helper safety and options money bounds
        run: python3 -m league.ci --no-tests
