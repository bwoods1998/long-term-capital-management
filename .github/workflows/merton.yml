name: Merton

# Automatic helper proposals are judged with read-only tokens. All merges and deployments
# remain owner actions. pull_request_target guards with main's own path policy.

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: merton-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    # The path guard, from main's copy of league/ci.py, against the branch's commits.
    # `astra/` as well as `merton/`: the DEPLOYED gateway still names branches with the old prefix,
    # so every proposal Merton opened landed on a branch this workflow ignored and sat open for
    # ever. The role is the second segment either way, so the path guard below is exactly as tight.
    if: (startsWith(github.head_ref, 'merton/') || startsWith(github.head_ref, 'astra/')) && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the branch without checking it out
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${NUMBER}/head:refs/remotes/pull/head"
      - name: May this role change these paths?
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 -m league.ci --guard-only --base HEAD --head refs/remotes/pull/head --branch "$BRANCH"

  judge:
    # The branch's own code: content checks and the whole league suite. Read-only token, no secrets.
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Gym dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-gym.txt
      - name: Content checks and the options suite
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 -m league.ci --base origin/main --branch "$BRANCH"
